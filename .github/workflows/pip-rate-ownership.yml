name: Pip calculator reference-rate regression
on:
  pull_request:
    paths:
      - 'tools/pip.html'
      - 'scripts/test-pip-moves.cjs'
      - '.github/workflows/pip-rate-ownership.yml'
permissions:
  contents: read
jobs:
  pip-rates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test scripts/test-pip-moves.cjs
