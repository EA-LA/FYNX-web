name: Scenario link history privacy
on:
  pull_request:
    paths:
      - 'assets/js/scenario-link.js'
      - 'scripts/test-scenario-link-privacy.cjs'
      - '.github/workflows/scenario-link-privacy.yml'
  push:
    branches:
      - fix/scenario-link-history-privacy-20261110
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check assets/js/scenario-link.js
      - run: node --check scripts/test-scenario-link-privacy.cjs
      - run: node --test scripts/test-scenario-link-privacy.cjs
