name: TEMP probe
on:
  push:
    branches: [tmp/probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://us-central1-fynx-c7a28.cloudfunctions.net/webResearchData
          for u in "$B?action=history&symbol=SAP.DE" "$B?action=history&symbol=PLTR" "$B?action=quotes&symbols=SAP.DE,PLTR,7203.T" "$B?action=history&symbol=ES%3DF" "$B?action=search&q=nvidia" "https://query1.finance.yahoo.com/v1/finance/search?q=nvidia&quotesCount=3"; do
            echo "=== $u"; curl -s -m 25 -H "Origin: https://www.fynxfinanceworld.com" -D - -o /tmp/b "$u" | grep -iE "^(HTTP|content-type|access-control)" ; head -c 400 /tmp/b; echo; done
