name: TEMP probe
on:
  push:
    branches: [tmp/probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://us-central1-fynx-c7a28.cloudfunctions.net/webResearchData
          for u in "$B?action=financials&cik=320193" "$B?action=financials&cik=1045810" "$B?action=directory"; do
            echo "=== $u"; curl -s -m 40 -A "FYNX Finance World research@fynxfinanceworld.com" -H "Origin: https://www.fynxfinanceworld.com" -D - -o /tmp/b -w "time %{time_total}\n" "$u" | grep -iE "^(HTTP|content-type|access-control|time)" ; head -c 600 /tmp/b; echo; done
