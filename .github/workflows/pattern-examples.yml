name: Pattern illustration compatibility
on:
  pull_request:
    paths:
      - 'assets/js/pattern-examples.js'
      - 'markets/patterns.html'
      - 'scripts/test-pattern-examples.cjs'
      - '.github/workflows/pattern-examples.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/test-pattern-examples.cjs
