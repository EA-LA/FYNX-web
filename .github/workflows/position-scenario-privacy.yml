name: Position Size scenario copy privacy

on:
  pull_request:
    paths:
      - 'tools/position-size.html'
      - 'scripts/test-position-scenario-privacy.cjs'
      - '.github/workflows/position-scenario-privacy.yml'
  push:
    branches: [main]
    paths:
      - 'tools/position-size.html'
      - 'scripts/test-position-scenario-privacy.cjs'
      - '.github/workflows/position-scenario-privacy.yml'

permissions:
  contents: read

jobs:
  scenario-privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check scripts/test-position-scenario-privacy.cjs
      - name: Run actual Position Size controller regression tests
        run: node --test scripts/test-position-scenario-privacy.cjs