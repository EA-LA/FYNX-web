name: Intelligence source excerpt publication safety
on:
  pull_request:
    paths:
      - 'scripts/build-intelligence.cjs'
      - 'tests/intelligence/source-excerpt-cap.test.cjs'
      - '.github/workflows/intelligence-excerpt-publication.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-excerpt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check publisher syntax
        run: node --check scripts/build-intelligence.cjs
      - name: Test public excerpt limit, integrity and attribution
        run: node --test tests/intelligence/source-excerpt-cap.test.cjs
