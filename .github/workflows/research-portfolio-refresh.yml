name: Research portfolio refresh feedback
on:
  pull_request:
    paths:
      - 'assets/js/research/personal.js'
      - 'assets/js/research/holding-undo.js'
      - 'scripts/test-research-holding-undo.cjs'
      - 'assets/js/research/app.js'
      - 'scripts/test-research-portfolio-refresh.cjs'
      - '.github/workflows/research-portfolio-refresh.yml'
  push:
    branches: [main]
    paths:
      - 'assets/js/research/personal.js'
      - 'assets/js/research/holding-undo.js'
      - 'scripts/test-research-holding-undo.cjs'
      - 'assets/js/research/app.js'
      - 'scripts/test-research-portfolio-refresh.cjs'
      - '.github/workflows/research-portfolio-refresh.yml'
permissions:
  contents: read
jobs:
  portfolio-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/test-research-portfolio-refresh.cjs
      - run: node --test scripts/test-research-portfolio-refresh.cjs scripts/test-research-focus.cjs scripts/test-research-holding-undo.cjs
