name: Notification Preference Save Integrity
on:
  pull_request:
    paths:
      - 'notifications.html'
      - 'assets/js/notifications/preference-save.mjs'
      - 'scripts/test-notification-preference-save.cjs'
      - '.github/workflows/notification-preference-save.yml'
  push:
    branches: [main]
    paths:
      - 'notifications.html'
      - 'assets/js/notifications/preference-save.mjs'
      - 'scripts/test-notification-preference-save.cjs'
      - '.github/workflows/notification-preference-save.yml'
jobs:
  notification-preferences:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check module syntax
        run: node --check assets/js/notifications/preference-save.mjs
      - name: Check HTML module syntax and test notification preference behavior
        run: node --test scripts/test-notification-preference-save.cjs
