name: TEMP intelligence live run
on:
  push:
    branches: [tmp/check-live]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: claude/fynx-intelligence}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: INTELLIGENCE_DUMP=intelligence-feeds.json node scripts/build-intelligence.cjs && mkdir -p intelligence/data && mv intelligence-feeds.json intelligence/data/feeds-dump.json
      - run: node --test tests/intelligence/*.test.cjs
      - run: |
          git config user.name tmp; git config user.email tmp@users.noreply.github.com
          git checkout -q -b tmp/intel-out
          git add -f intelligence && git commit -qm "TEMP intelligence output" && git push -q -f origin tmp/intel-out
