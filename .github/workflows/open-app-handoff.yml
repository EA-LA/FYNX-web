name: Native app handoff fallback regression

on:
  pull_request:
    paths:
      - "open-app.html"
      - "scripts/test-open-app-handoff.cjs"
      - ".github/workflows/open-app-handoff.yml"
  push:
    branches: [main]
    paths:
      - "open-app.html"
      - "scripts/test-open-app-handoff.cjs"
      - ".github/workflows/open-app-handoff.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check scripts/test-open-app-handoff.cjs
      - run: node --test scripts/test-open-app-handoff.cjs
