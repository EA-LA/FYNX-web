name: Manual Refresh Recovery

on:
  pull_request:
    paths:
      - "assets/js/auto-refresh.js"
      - "scripts/test-auto-refresh-recovery.cjs"
      - ".github/workflows/auto-refresh-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manual-refresh-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --check assets/js/auto-refresh.js
      - run: node --test scripts/test-auto-refresh-recovery.cjs
