name: Terminal currency strength source age regression
on:
  pull_request:
    paths:
      - 'assets/js/terminal/strength.js'
      - 'terminal.html'
      - 'scripts/test-terminal-strength-source-age.cjs'
      - '.github/workflows/terminal-strength-source-age.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strength-source-age:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check assets/js/terminal/strength.js
      - run: node --check scripts/test-terminal-strength-source-age.cjs
      - run: node --test scripts/test-terminal-strength-source-age.cjs
