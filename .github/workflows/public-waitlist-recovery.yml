name: Public waitlist recovery
on:
  pull_request:
    paths:
      - "assets/js/public-waitlist.js"
      - "scripts/test-public-waitlist-recovery.cjs"
      - ".github/workflows/public-waitlist-recovery.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check assets/js/public-waitlist.js
      - run: node --test scripts/test-public-waitlist-recovery.cjs
