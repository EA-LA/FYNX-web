name: TEMP world live check
on:
  push:
    branches: [tmp/world-live]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node .github/tmp/fn_test.cjs
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install playwright==1.48.0
      - run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/srv.log 2>&1 &
          sleep 2
          python3 .github/tmp/world_live.py
