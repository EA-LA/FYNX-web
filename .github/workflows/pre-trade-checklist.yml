name: Public pre-trade checklist

on:
  pull_request:
    paths:
      - 'trading-psychology.html'
      - 'assets/js/pre-trade-checklist.js'
      - 'scripts/test-pre-trade-checklist.cjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pre-trade-checklist.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-trade-checklist:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --check assets/js/pre-trade-checklist.js
      - run: node --test scripts/test-pre-trade-checklist.cjs
