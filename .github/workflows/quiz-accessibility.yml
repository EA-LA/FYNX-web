name: Quiz keyboard and focus regression

on:
  pull_request:
    paths:
      - 'trading-quizzes.html'
      - 'scripts/test-quiz-accessibility.cjs'
      - 'package.json'
      - '.github/workflows/quiz-accessibility.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quiz-accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate quiz interaction and syntax
        run: |
          node --check scripts/test-quiz-accessibility.cjs
          node scripts/test-quiz-accessibility.cjs
