name: Economic calendar data trust regression

on:
  pull_request:
    paths:
      - assets/js/fynx-calendar.js
      - tools/economic-calendar.html
      - home.html
      - scripts/build-release-assets.cjs
      - scripts/test-fynx-calendar-ui.cjs
      - .github/workflows/economic-calendar-release-trust.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calendar-trust:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify calendar syntax
        run: node --check assets/js/fynx-calendar.js && node --check scripts/test-fynx-calendar-ui.cjs
      - name: Exercise calendar UI, missing values, source confirmation, and ICS export
        run: node scripts/test-fynx-calendar-ui.cjs
