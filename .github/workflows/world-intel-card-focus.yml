name: Terminal world event card focus
on:
  pull_request:
    paths:
      - 'assets/js/terminal/world-intel.js'
      - 'scripts/test-world-intel-card-focus.cjs'
      - '.github/workflows/world-intel-card-focus.yml'
permissions:
  contents: read
jobs:
  focus:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test scripts/test-world-intel-card-focus.cjs scripts/test-world-intel-headline-time.cjs
