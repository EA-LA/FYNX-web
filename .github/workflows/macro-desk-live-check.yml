name: Macro Desk live check (temporary)
on:
  push:
    branches: [claude/macro-desk]
    paths: ['.github/qa/macro-live-check.cjs', '.github/workflows/macro-desk-live-check.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm i --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: (python3 -m http.server 8080 >/dev/null 2>&1 &) && sleep 2 && node .github/qa/macro-live-check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: macro-screens, path: 'macro-*.png'}
