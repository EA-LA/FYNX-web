name: FYNX production repository tree safety

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-tree-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify guard regression scenarios
        run: node scripts/verify-repository-tree.cjs --self-test
      - name: Verify complete FYNX production source inventory
        run: node scripts/verify-repository-tree.cjs
