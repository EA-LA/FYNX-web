name: Account settings tab navigation
on:
  pull_request:
    paths:
      - 'assets/js/settings-shell.js'
      - 'scripts/test-settings-tab-scroll.cjs'
      - '.github/workflows/settings-tab-scroll.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  settings-tab-scroll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check assets/js/settings-shell.js
      - run: node --check scripts/test-settings-tab-scroll.cjs
      - run: node --test scripts/test-settings-tab-scroll.cjs
