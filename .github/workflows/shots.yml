name: Terminal screenshots (temporary)
on:
  push:
    branches: [claude/terminal-screens]
permissions:
  contents: read
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm i --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: (python3 -m http.server 8080 >/dev/null 2>&1 &) && sleep 2 && node .github/qa/shots.cjs
