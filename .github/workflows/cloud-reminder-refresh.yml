name: Cloud calendar reminder refresh regression

on:
  pull_request:
    paths:
      - 'assets/js/cloud-reminders.js'
      - 'scripts/test-cloud-reminder-refresh.cjs'
      - '.github/workflows/cloud-reminder-refresh.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloud-reminders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser script syntax
        run: node --check assets/js/cloud-reminders.js
      - name: Test out-of-order refresh, account changes, and scheduling feedback
        run: node --test scripts/test-cloud-reminder-refresh.cjs
