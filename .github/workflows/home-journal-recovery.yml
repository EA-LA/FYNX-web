name: Homepage Journal Sync Recovery
on:
  pull_request:
    paths:
      - 'assets/js/home-journal.js'
      - 'assets/css/terminal-home.css'
      - 'home.html'
      - 'scripts/test-home-journal-recovery.cjs'
      - '.github/workflows/home-journal-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  journal-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check assets/js/home-journal.js
      - run: node --check scripts/test-home-journal-recovery.cjs
      - run: node --test scripts/test-home-journal-recovery.cjs
