name: TEMP terminal live check
on:
  push:
    branches: [claude/terminal-desks]
    paths: ['.github/tmp/live_check.py', '.github/workflows/tmp-terminal-live.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install playwright==1.48.0 && python -m playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/srv.log 2>&1 &
          sleep 2
          python3 .github/tmp/live_check.py
