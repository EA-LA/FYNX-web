name: Security session metadata rendering

on:
  pull_request:
    paths:
      - 'security.html'
      - 'assets/js/security-session-list.js'
      - 'scripts/test-security-session-list.cjs'
      - '.github/workflows/security-session-list.yml'
  push:
    branches: [main]
    paths:
      - 'security.html'
      - 'assets/js/security-session-list.js'
      - 'scripts/test-security-session-list.cjs'
      - '.github/workflows/security-session-list.yml'

permissions:
  contents: read

jobs:
  session-rendering:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check assets/js/security-session-list.js
      - run: node --test scripts/test-security-session-list.cjs
