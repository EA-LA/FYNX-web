name: Shared Intelligence and Media Contracts
on:
  pull_request:
    paths:
      - 'backend/*reader*'
      - 'backend/*intelligence*'
      - 'backend/story-evidence*'
      - 'assets/js/*reader*'
      - 'assets/js/shared-story.js'
      - 'assets/js/intelligence-editorial-preferences.js'
      - 'assets/js/fynx-calendar.js'
      - 'scripts/test-news-reader*'
      - 'scripts/test-shared-story.cjs'
      - 'scripts/test-intelligence-editorial-preferences.cjs'
      - 'scripts/test-fynx-calendar-intelligence.cjs'
      - '.github/workflows/intelligence-ecosystem.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix backend --ignore-scripts --no-audit --no-fund
      - name: Verify story evidence, identities, expiry, calendar and preferences
        run: node --test backend/story-evidence.test.cjs backend/published-intelligence.test.cjs backend/news-reader.test.cjs backend/news-reader-store.test.cjs backend/market-feed.test.cjs scripts/test-news-reader-ui.cjs scripts/test-news-reader-links.cjs scripts/test-news-reader-bookmarks.cjs scripts/test-shared-story.cjs scripts/test-intelligence-editorial-preferences.cjs scripts/test-fynx-calendar-intelligence.cjs
