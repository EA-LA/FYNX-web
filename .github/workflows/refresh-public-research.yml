name: Refresh public market research
on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-research-data
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --omit=dev
      - name: Prepare public data branch
        shell: bash
        run: |
          set -euo pipefail
          publish="$RUNNER_TEMP/public-research"
          if git ls-remote --exit-code --heads origin refs/heads/research-data; then
            git fetch --depth=1 origin refs/heads/research-data
            git worktree add --detach "$publish" FETCH_HEAD
          else
            code=$?
            if [[ "$code" != 2 ]]; then exit "$code"; fi
            git worktree add --detach "$publish" HEAD
            git -C "$publish" switch --orphan initial-public-data
            mkdir -p "$publish/assets/data"
            cp -R assets/data/research "$publish/assets/data/research"
          fi
      - name: Refresh from market publishers
        run: node scripts/refresh-public-research.cjs "$RUNNER_TEMP/public-research/assets/data/research"
      - name: Publish completed snapshot
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/public-research"
          git config user.name 'FYNX market research publisher'
          git config user.email 'actions@users.noreply.github.com'
          # Data-only branch: tell Vercel not to deploy it (each push otherwise uses a deployment).
          printf '{"git":{"deploymentEnabled":false}}\n' > vercel.json
          git add -- assets/data/research vercel.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh observed market data $(date -u +%F)"
          git push origin HEAD:refs/heads/research-data
