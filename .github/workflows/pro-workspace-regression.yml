name: Pro workspace result freshness

on:
  pull_request:
    paths:
      - "pro.html"
      - "welcome.html"
      - "assets/js/welcome.js"
      - "scripts/test-pro-welcome-verification.cjs"
      - "backend/consumer-core.cjs"
      - "backend/consumer-core.test.cjs"
      - "backend/consumer-live-workspace.cjs"
      - "backend/consumer-live-workspace.test.cjs"
      - "backend/owner-access.cjs"
      - "backend/owner-access.test.cjs"
      - "backend/industry-analytics.cjs"
      - "backend/account-sync-membership.cjs"
      - "backend/accounts/entitlements.cjs"
      - "backend/developer-core.cjs"
      - "backend/developer-api.cjs"
      - "assets/js/fynx-plan.js"
      - "assets/js/profile-membership.js"
      - "profile.html"
      - "scripts/test-owner-membership-ui.cjs"
      - "scripts/test-fynx-plan-usage.cjs"
      - "assets/js/pro-workspace.js"
      - "assets/css/pro-workspace.css"
      - "scripts/test-consumer-live-ui.cjs"
      - "scripts/test-pro-workspace-result-notes.cjs"
      - ".github/workflows/pro-workspace-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pro-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test backend/consumer-core.test.cjs backend/consumer-live-workspace.test.cjs backend/owner-access.test.cjs
      - run: node scripts/test-owner-membership-ui.cjs && node scripts/test-fynx-plan-usage.cjs
      - run: node --test scripts/test-consumer-live-ui.cjs scripts/test-pro-workspace-result-notes.cjs
      - run: node --test scripts/test-pro-welcome-verification.cjs
      - run: node scripts/test-pro-routing.cjs
      - run: npm run build
