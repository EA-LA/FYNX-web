name: Correlation CSV Export Regression

on:
  pull_request:
    paths:
      - 'tools/correlation.html'
      - 'assets/js/correlation-export.js'
      - 'scripts/test-correlation-export.cjs'
      - '.github/workflows/correlation-export.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  correlation-export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install existing DOM test dependency
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check syntax
        run: |
          node --check assets/js/correlation-export.js
          node --check scripts/test-correlation-export.cjs
      - name: Verify real page controller and CSV behavior
        run: node --test scripts/test-correlation-export.cjs
