name: Terminal scanner saved-state recovery

on:
  pull_request:
    paths:
      - 'assets/js/terminal/scanner.js'
      - 'scripts/test-terminal-scanner-saved-state.cjs'
      - 'terminal.html'
      - '.github/workflows/terminal-scanner-saved-state.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scanner-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --check assets/js/terminal/scanner.js
      - run: node --test scripts/test-terminal-scanner-saved-state.cjs
