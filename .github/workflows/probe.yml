name: Probe Dow table (temporary, read-only)
on: push
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node -e "
          const {tables}=require('./refresh-equities.cjs');
          fetch('https://en.wikipedia.org/wiki/Dow_Jones_Industrial_Average',{headers:{'User-Agent':'Mozilla/5.0 Chrome/130'}}).then(r=>r.text()).then(h=>{
            tables(h).forEach((t,i)=>{ if(t.rows.length>=25&&t.rows.length<=40) console.log('T',i,t.id,JSON.stringify(t.headers),'rows',t.rows.length,JSON.stringify(t.rows[0]),JSON.stringify(t.rows[1])); });
            const i=h.indexOf('id=\"constituents\"'); console.log('CONST', i, h.slice(i-200,i+2500).replace(/\s+/g,' '));
          });"
