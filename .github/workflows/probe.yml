name: probe crypto sentiment
on: push
permissions:
  contents: read
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: |
          mkdir -p out prev
          curl -sfL https://raw.githubusercontent.com/EA-LA/FYNX-web/terminal-data/scanner.json -o out/scanner.json && ls -la out
          curl -sfL https://raw.githubusercontent.com/EA-LA/FYNX-web/terminal-data/equities.json -o out/equities.json || true
          node probe/refresh-sentiment.cjs out prev
          node -e "const d=require('./out/sentiment.json');const c=d.crypto;console.log(JSON.stringify({fng:c?.fng&&{asOf:c.fng.asOf,score:c.fng.score,label:c.fng.label,n:c.fng.history.length,prev:c.fng.prev,year:c.fng.year},season:c?.season&&{...c.season,history:c.season.history.length},rsi:c?.rsi&&{...c.rsi,history:c.rsi.history.length},coins:c?.coins?.length,top:c?.coins?.slice(0,12),universe:c?.universe}))"
