name: terminal live audit
on: push
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        vp: ['1920x1080', '1440x900', '3440x1440', '3840x2160', '1024x1366', '390x844']
    steps:
      - uses: actions/checkout@v4
        with: {ref: feature/terminal-audit-focus}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/audit-terminal.cjs out --viewport=${{ matrix.vp }} ${{ (matrix.vp == '1920x1080' || matrix.vp == '1440x900') && ' ' || '--quick' }}
        env: {FYNX_CHROMIUM_PATH: /usr/bin/google-chrome}
      - uses: actions/upload-artifact@v4
        with: {name: 'audit-${{ matrix.vp }}', path: out, retention-days: 3}
