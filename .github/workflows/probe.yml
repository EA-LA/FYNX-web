name: probe terminal audit
on: push
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {ref: terminal/focus-sync, path: app}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: cd app && npm ci --ignore-scripts --no-audit --no-fund
      - name: focus
        run: |
          git config --global user.name probe && git config --global user.email probe@users.noreply.github.com
          export FYNX_CHROMIUM_PATH=$(which google-chrome)
          rm -rf focus2; mkdir -p focus2; (cd app && timeout 3000 node scripts/probe-focus.cjs ../focus2 --symbols=META,AAPL,NVDA,MSFT,BFLR,ANT,EURUSD,GBPUSD,USDTRY,BTC,ETH,SOL,SPY,XAUUSD > ../focus2/run.log 2>&1 || echo "exit $?" >> ../focus2/run.log)
          git add focus2 && git commit -qm "focus probe 2" && git pull -q --rebase && git push -q
