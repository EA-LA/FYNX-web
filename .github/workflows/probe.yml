name: probe live routes
on: push
permissions:
  contents: read
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          hit(){ echo "=== $1"; curl -s -m 40 -o /tmp/o -w "HTTP %{http_code} %{content_type}\n" "$1" -H 'Accept: application/json' ${2:+-X POST -H 'Content-Type: application/json' -d "$2"}; head -c 400 /tmp/o; echo; }
          hit "https://fynxfinanceworld.vercel.app/fn/research.js?action=directory"
          hit "https://fynxfinanceworld.vercel.app/fn/research.js?action=filings&cik=320193"
          hit "https://us-central1-fynx-c7a28.cloudfunctions.net/webResearchData?action=filings&cik=320193"
          hit "https://us-central1-fynx-c7a28.cloudfunctions.net/webResearchData?action=financials&cik=320193"
          hit "https://fynxfinanceworld.vercel.app/fn/market.js?op=closes&symbols=AAPL,SPY&range=1y"
          hit "https://us-central1-fynx-c7a28.cloudfunctions.net/consumerLiveWorkspace" '{"data":{"action":"status"}}'
          hit "https://us-central1-fynx-c7a28.cloudfunctions.net/consumerLiveWorkspace" '{"data":{"action":"industries"}}'
          hit "https://us-central1-fynx-c7a28.cloudfunctions.net/fynxAccountSync" '{"data":{"action":"read"}}'
          hit "https://raw.githubusercontent.com/EA-LA/FYNX-web/terminal-data/sentiment.json"
          curl -s https://raw.githubusercontent.com/EA-LA/FYNX-web/terminal-data/sentiment.json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const d=JSON.parse(s);console.log(JSON.stringify({gen:d.generatedAt,asOf:d.asOf,score:d.score,label:d.label,ind:d.indicators.filter(i=>Number.isFinite(i.score)).length,hist:d.history.length,mich:d.michigan?.length,crypto:{fng:d.crypto?.fng?.score,season:d.crypto?.season?.value,rsi:d.crypto?.rsi?.value,coins:d.crypto?.coins?.length}}))})"
          hit "https://www.fynxfinanceworld.com/terminal.html"
          curl -s https://www.fynxfinanceworld.com/terminal.html | grep -o 'markets-plus.js[^"]*\|markets-dash.js[^"]*\|pages.js[^"]*' | head
