name: probe terminal audit
on: push
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {ref: terminal/focus-sync, path: app}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: cd app && npm ci --ignore-scripts --no-audit --no-fund
      - name: focus
        run: |
          git config --global user.name probe && git config --global user.email probe@users.noreply.github.com
          export FYNX_CHROMIUM_PATH=$(which google-chrome)
          mkdir -p focus; (cd app && timeout 2400 node scripts/probe-focus.cjs ../focus > ../focus/run.log 2>&1 || echo "exit $?" >> ../focus/run.log)
          git add focus && git commit -qm "focus probe" && git pull -q --rebase && git push -q
