name: probe terminal audit
on: push
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {ref: terminal/no-chart-selection, path: app}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: cd app && npm ci --no-audit --no-fund && npx playwright install --with-deps webkit
      - name: webkit drag
        run: |
          git config --global user.name probe && git config --global user.email probe@users.noreply.github.com
          mkdir -p webkit
          (cd app && FYNX_BROWSER=webkit timeout 1800 node --test --test-name-pattern="real press-and-drag|dragging on charts" scripts/test-terminal-markets-plus-e2e.cjs > ../webkit/drag.txt 2>&1 || echo "exit $?" >> ../webkit/drag.txt)
          git add webkit && git commit -qm "webkit drag" && git pull -q --rebase && git push -q
