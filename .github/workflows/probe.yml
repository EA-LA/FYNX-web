name: Probe equities publisher (temporary, read-only)
on: push
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node refresh-equities.cjs out
      - run: node -e "const d=require('./out/equities.json'); console.log('DOWRESULT', d.sources.dow, d.indices.dow.join(' '))"
