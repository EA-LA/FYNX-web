name: Probe equities publisher (temporary, read-only)
on: push
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node refresh-equities.cjs out
      - run: |
          ls -la out
          node -e "
          const d=require('./out/equities.json');
          console.log('IDX', Object.entries(d.indices).map(([k,v])=>k+':'+v.length).join(' '), 'fresh', d.fresh, '/', d.total, 'sources', JSON.stringify(d.sources));
          console.log('DOW', d.indices.dow.join(' '));
          console.log('SAMPLE', JSON.stringify(d.info['BRK-B']), JSON.stringify(d.closes['BRK-B']));
          console.log('AAPL', JSON.stringify(d.closes.AAPL));
          console.log('MISSING', [...new Set(Object.values(d.indices).flat())].filter(s=>!d.closes[s]).join(' '));
          console.log('MACRO', d.macro.dates.length, d.macro.dates[0], d.macro.spx.at(-1), d.macro.tnx.at(-1), d.macro.dxy.at(-1));
          console.log('SECTORS', [...new Set(d.indices.sp500.map(s=>d.info[s].sec))].join('|'));
          "
