name: Market Movers snapshot recovery
on:
  pull_request:
    paths:
      - 'assets/js/home-movers.js'
      - 'scripts/test-home-movers-recovery.cjs'
      - '.github/workflows/home-movers-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --check assets/js/home-movers.js
      - run: node --test scripts/test-home-movers-recovery.cjs
