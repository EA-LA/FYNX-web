<div><h2 style="font-size:28px">Preferences</h2><p style="color:#888;font-size:13px;margin-top:4px">Platform behavior defaults for tools, alerts, and market workflow.</p></div>
<form class="card" id="prefForm"><div class="grid">
<div class="field"><label>Theme mode</label><select id="themeMode" aria-label="Theme mode"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></div>
<div class="field"><label>Preferred app language</label><input id="language" aria-label="Preferred app language" placeholder="en" maxlength="20"><small>Language code used by supported FYNX apps.</small></div>
<div class="field"><label>Timezone</label><input id="timezone" aria-label="Timezone"></div>
<div class="field"><label>Currency</label><select id="currency" aria-label="Currency"><option>USD</option><option>EUR</option><option>GBP</option><option>JPY</option></select></div>
<div class="field"><label>Date/time format</label><select id="dateTimeFormat" aria-label="Date time format"><option value="MMM d, yyyy HH:mm">MMM d, yyyy HH:mm</option><option value="MM/dd/yyyy hh:mm a">MM/dd/yyyy hh:mm a</option><option value="dd/MM/yyyy HH:mm">dd/MM/yyyy HH:mm</option></select></div>
<div class="field"><label>Default risk %</label><input type="number" min="0.1" max="10" step="0.1" id="defaultRiskPercent" aria-label="Default risk percent"></div>
<div class="field"><label>Default lot size</label><input type="number" min="0.01" max="100" step="0.01" id="defaultLotSize" aria-label="Default lot size"></div>
<div class="field"><label>Default RR</label><input type="number" min="0.1" max="20" step="0.1" id="defaultRR" aria-label="Default rr"></div>
<div class="field"><label>Preferred market focus</label><select id="preferredMarketFocus" aria-label="Preferred market focus"><option value="forex">Forex</option><option value="crypto">Crypto</option><option value="stocks">Stocks</option><option value="indices">Indices</option><option value="commodities">Commodities</option></select></div>
</div>
<div class="card" style="margin-top:12px">
<div class="row"><span>Email alerts</span><button class="switch" data-switch="emailAlerts" type="button"><span class="knob"></span></button></div>
<div class="row"><span>In-app alerts</span><button class="switch" data-switch="inAppAlerts" type="button"><span class="knob"></span></button></div>
<div class="row"><span>Sound alerts</span><button class="switch" data-switch="soundAlerts" type="button"><span class="knob"></span></button></div>

</div>
<div style="margin-top:12px;display:flex;justify-content:space-between;align-items:center"><small id="saveStatus" style="color:#777" role="status">Loading preferences…</small><button class="btn primary" type="submit" disabled>Save preferences</button></div>

<script type="module" src="assets/js/session-bootstrap.js?v=20261114-heatmaps-1"></script>
<script type="module">
import {subscribe,accountData,sync} from './assets/js/account-sync.js?v=20261114-heatmaps-1';
import { auth, bootstrapAccount, saveUserPreferences } from './assets/js/account-system.js?v=20261114-heatmaps-1';
import { mountNotificationBell } from './assets/js/account-ui.js?v=20261114-heatmaps-1';
import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';
document.querySelector('#prefForm button[type=submit]').disabled=true;
saveStatus.textContent='Loading preferences…';
let preferencesDirty=false,preferencesOwner=null,preferencesEpoch=0,preferencesRevision=0;document.getElementById('prefForm').addEventListener('input',()=>preferencesDirty=true);document.getElementById('prefForm').addEventListener('click',event=>{if(event.target.closest('.switch'))preferencesDirty=true;});
const bools = { emailAlerts:true, inAppAlerts:true, soundAlerts:false, performanceMode:false };
function applyTheme(){const t=window.FynxPreferences?.getItem('fynx_theme');document.body.classList.toggle('dark-mode',t==='dark');} applyTheme();
(document.getElementById('themeBtn')||{}).onclick=()=>{const d=!document.body.classList.contains('dark-mode');document.body.classList.toggle('dark-mode',d);window.FynxPreferences?.setItem('fynx_theme',d?'dark':'light');};
document.querySelectorAll('.switch').forEach((s)=>s.onclick=()=>{const k=s.dataset.switch;bools[k]=!bools[k];s.classList.toggle('on',bools[k]);});
function fill(pref){preferencesRevision=sync.record('preferences','default')?.revision||0;['themeMode','language','timezone','currency','dateTimeFormat','defaultRiskPercent','defaultLotSize','defaultRR','preferredMarketFocus'].forEach((id)=>document.getElementById(id).value=pref[id] ?? (id==='language'?'en':''));Object.keys(bools).forEach((k)=>{bools[k]=Boolean(pref[k]);document.querySelector(`.switch[data-switch="${k}"]`).classList.toggle('on',bools[k]);});}
onAuthStateChanged(auth,async user=>{const epoch=++preferencesEpoch;preferencesOwner=user?.uid||null;preferencesDirty=false;document.querySelector('#prefForm button[type=submit]').disabled=true;document.getElementById('prefForm').reset();if(!user)return;try{const seeded=await bootstrapAccount(user);if(epoch!==preferencesEpoch||auth.currentUser?.uid!==user.uid)return;fill(seeded.preferences);document.querySelector('#prefForm button[type=submit]').disabled=false;saveStatus.textContent='Ready';}catch{if(epoch===preferencesEpoch)saveStatus.textContent='Could not load preferences. Check your connection and reload.';}});
subscribe(state=>{if(state.uid!==preferencesOwner||!state.ready)return;const pref=accountData('preferences');if(!pref)return;if(preferencesDirty){if(state.status==='synced')saveStatus.textContent='Your draft is kept. Save to apply it, or reload to use the latest account preferences.';return;}fill(pref);if(['light','dark'].includes(pref.themeMode)){window.FynxPreferences?.setItem('fynx_theme',pref.themeMode);applyTheme();}saveStatus.textContent=state.status==='synced'?'Shared account preferences are up to date.':state.error||state.status;});
document.getElementById('prefForm').addEventListener('submit', async(e)=>{e.preventDefault();const button=e.currentTarget.querySelector('button[type=submit]');if(button.disabled)return;const user=auth.currentUser;if(!user){saveStatus.textContent='Sign in again to save.';return;}if(!navigator.onLine){saveStatus.textContent='You’re offline. Reconnect to save.';return;}button.disabled=true;try{const payload={themeMode:themeMode.value,language:language.value.trim()||"en",timezone:timezone.value.trim(),currency:currency.value,dateTimeFormat:dateTimeFormat.value,defaultRiskPercent:Number(defaultRiskPercent.value||1),defaultLotSize:Number(defaultLotSize.value||0.1),defaultRR:Number(defaultRR.value||2),preferredMarketFocus:preferredMarketFocus.value,...bools};saveStatus.textContent='Saving...';await saveUserPreferences(user.uid,payload,{expectedRevision:preferencesRevision});localStorage.setItem('fynx_preferences',JSON.stringify(payload));if(payload.themeMode==='dark'||payload.themeMode==='light'){window.FynxPreferences?.setItem('fynx_theme',payload.themeMode);applyTheme();}preferencesDirty=false;saveStatus.textContent='Saved to your account';}catch{saveStatus.textContent='Could not save. Your changes are still here. Check your connection and try again.';}finally{button.disabled=false;}});
mountNotificationBell();
</script>
