<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>Account recovery — FYNX Finance World</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f3f6f4;color:#17251d;font:16px/1.6 system-ui,sans-serif}.card{width:min(100%,460px);padding:36px;border:1px solid #d9e3dc;border-radius:20px;background:#fff;box-shadow:0 16px 50px #17251d0a}.brand{font-size:13px;font-weight:750;letter-spacing:.08em;color:#41664e}h1{line-height:1.2;font-size:28px;margin:22px 0 14px}label{display:block;margin-top:18px;font-size:14px;font-weight:600}input,button{width:100%;padding:13px;border-radius:9px;font:inherit}input{border:1px solid #abbeb0;margin-top:6px}button{margin-top:22px;background:#214d34;color:white;border:0;font-weight:650;cursor:pointer}button:disabled{opacity:.55;cursor:wait}a{color:#214d34}#status{color:#506558}#status[data-error=true]{color:#a52424}[hidden]{display:none!important}input:focus-visible,a:focus-visible,button:focus-visible{outline:3px solid #79ad8b;outline-offset:3px}.help{font-size:13px;color:#506558}.links{margin:24px 0 0}</style></head>
<body><main class="card"><div class="brand">FYNX FINANCE WORLD</div><h1 id="heading">Checking your link…</h1><p id="status" role="status" aria-live="polite">Please wait while we verify this secure link.</p><form id="resetForm" hidden><label for="password">New password</label><input id="password" type="password" autocomplete="new-password" minlength="8" required><p class="help">Use at least 8 characters.</p><label for="confirm">Confirm new password</label><input id="confirm" type="password" autocomplete="new-password" minlength="8" required><button type="submit">Save new password</button></form><p class="links"><a id="continue" href="/auth/login.html">Back to sign in</a></p><p><a id="retry" href="/auth/forgot.html" hidden>Request a new reset link</a></p></main><script type="module" src="./action.js"></script></body></html>
