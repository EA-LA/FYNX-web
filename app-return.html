  <style>
    body{
      margin:0; min-height:100vh; min-height:100svh; padding:16px; display:grid; place-items:center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:#000; color:#fff;
    }
    .card{
      width:min(520px, 100%);
      border:1px solid rgba(255, 255, 255, .14);
      background: rgba(255, 255, 255, .06);
      border-radius:18px;
      padding:18px 16px;
    }
    .title{ font-weight:800; margin:0 0 6px; font-size:16px; line-height:1.5; }
    .text{ margin:0; color: rgba(255, 255, 255, .72); font-size:13px; line-height:1.5; }
    .spinner{
      width: 18px; height: 18px;
      border: 2px solid rgba(255, 255, 255, .18);
      border-top-color: rgba(255, 255, 255, .9);
      border-radius: 999px;
      animation: spin .8s linear infinite;
      display:inline-block;
      vertical-align: -4px;
      margin-right: 10px;
    }
    @keyframes spin{ to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce){ .spinner{ animation:none; } }
    .retry{ margin-top:14px; }
    .retry a{ color:#fff; text-underline-offset:3px; }
    .retry a:focus-visible{ outline:2px solid currentColor; outline-offset:3px; }

<body data-fynx-layout="utility" data-fynx-section="FINANCE WORLD">
<!-- company-products:launch:start --><div id="fynx-products-launch" class="fp-launch"><a class="fp-trigger" data-company-products-open href="/products.html" aria-label="FYNX: Company & Products"><span class="fp-trigger-full">FYNX Products</span><span class="fp-trigger-short">Products</span><span aria-hidden="true">⌄</span></a></div><!-- company-products:launch:end -->
<main class="card" aria-labelledby="signin-title">
    <h1 class="title" id="signin-title"><span class="spinner" aria-hidden="true"></span>Signing you in…</h1>
    <p class="text" id="msg" role="status" aria-live="polite" aria-atomic="true">Confirming your login ticket.</p>
    <p class="text retry">Taking too long? <a href="/auth/login.html">Return to sign in</a>.</p>
    <noscript><p class="text retry">JavaScript is required to complete sign-in. Use the link above to return to sign in.</p></noscript>
  </main>

  <script type="module">
    import { signInWithCustomToken } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-functions.js";

    import { app, auth } from "./auth/firebase.js";
    import { safeReturnTo } from "./assets/js/route-utils.js?v=20260922-routing";
    const functions = getFunctions(app);

    const url = new URL(window.location.href);
    const ticket = url.searchParams.get("ticket");
    const returnTo = safeReturnTo(url.searchParams.get("returnTo"));

    const msg = document.getElementById("msg");

    function fail(text){
      msg.textContent = text;
      setTimeout(() => { window.location.href = "./auth/login.html"; }, 2000);
    }

    if (!ticket){
      fail("Missing ticket. Please try again.");
    } else {
      try{
        const exchange = httpsCallable(functions, "exchangeWebLoginTicket");
        msg.textContent = "Verifying ticket…";
        const res = await exchange({ ticket });

        const customToken = res?.data?.customToken;
        if (!customToken) {
          fail("Ticket invalid. Please try again.");
        } else {
          msg.textContent = "Signing in…";
          await signInWithCustomToken(auth, customToken);
          window.location.href = returnTo;
        }
      }catch(e){
        console.error(e);
        fail("Login failed. Please try again.");
      }
    }
  </script>

</body>
</html>
