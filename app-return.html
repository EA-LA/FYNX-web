<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/assets/js/site-theme-init.js?v=20260922-routing"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body{
      margin:0; height:100vh; display:grid; place-items:center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:#000; color:#fff;
    }
    .card{
      width:min(520px, 92vw);
      border:1px solid rgba(255, 255, 255, .14);
      background: rgba(255, 255, 255, .06);
      border-radius:18px;
      padding:18px 16px;
    }
    .title{ font-weight:800; margin:0 0 6px; font-size:14px; }
    .text{ margin:0; color: rgba(255, 255, 255, .72); font-size:13px; line-height:1.5; }
    .spinner{
      width: 18px; height: 18px;
      border: 2px solid rgba(255, 255, 255, .18);
      border-top-color: rgba(255, 255, 255, .9);
      border-radius: 999px;
      animation: spin .8s linear infinite;
      display:inline-block;
      vertical-align: -4px;
      margin-right: 10px;
    }
    @keyframes spin{ to { transform: rotate(360deg); } }
  </style>
  <link rel="stylesheet" href="assets/css/mobile-fixes.css">
  <script type="module" src="./assets/js/protect-route.js?v=59193b13e9f5"></script>
  <link rel="stylesheet" href="/assets/funded-system.css?v=20260915-global">
  <script src="/assets/js/journal-theme.js?v=20260922-routing" defer></script>
  <link rel="stylesheet" href="/assets/site-design.css?v=20260922-workspace">

<title>Signing you in…</title>
<meta name="description" content="Signing you in…. Explore this resource from FYNX Finance World.">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://www.fynxfinanceworld.com/app-return.html">
<meta property="og:title" content="Signing you in…">
<meta property="og:description" content="Signing you in…. Explore this resource from FYNX Finance World.">
<meta property="og:url" content="https://www.fynxfinanceworld.com/app-return.html">
</head>
<body data-fynx-layout="utility" data-fynx-section="FINANCE WORLD">
  <div class="card">
    <p class="title"><span class="spinner"></span>Signing you in…</p>
    <p class="text" id="msg">Confirming your login ticket.</p>
  </div>

  <script type="module">
    import { signInWithCustomToken } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-functions.js";

    import { app, auth } from "./auth/firebase.js";
    import { safeReturnTo } from "./assets/js/route-utils.js?v=20260922-routing";
    const functions = getFunctions(app);

    const url = new URL(window.location.href);
    const ticket = url.searchParams.get("ticket");
    const returnTo = safeReturnTo(url.searchParams.get("returnTo"));

    const msg = document.getElementById("msg");

    function fail(text){
      msg.textContent = text;
      setTimeout(() => { window.location.href = "./auth/login.html"; }, 2000);
    }

    if (!ticket){
      fail("Missing ticket. Please try again.");
    } else {
      try{
        const exchange = httpsCallable(functions, "exchangeWebLoginTicket");
        msg.textContent = "Verifying ticket…";
        const res = await exchange({ ticket });

        const customToken = res?.data?.customToken;
        if (!customToken) {
          fail("Ticket invalid. Please try again.");
        } else {
          msg.textContent = "Signing in…";
          await signInWithCustomToken(auth, customToken);
          window.location.href = returnTo;
        }
      }catch(e){
        console.error(e);
        fail("Login failed. Please try again.");
      }
    }
  </script>

</body>
</html>
