<div class="card" role="status" aria-live="polite">
    <p class="title"><span class="spinner" aria-hidden="true"></span>Opening FYNX…</p>
    <p class="text">If the app is installed, it will open now. Confirm login inside the app.</p>
    <p class="text" style="margin-top:10px;">If FYNX does not open, you can <a href="https://apps.apple.com/app/id6752357210">open it in the App Store</a>.</p>
  </div>

  <script>
    const APP_STORE_URL = "https://apps.apple.com/app/id6752357210";

    // Where we want the app to send the user back after confirm (app-return.html)
    const url = new URL(window.location.href);
    const returnTo = url.searchParams.get("returnTo") || "";

    // Your URL scheme (must exist in iOS app: fynx://)
    // We pass returnTo so app knows where to go back after confirm.
    const deepLink = `fynx://auth/web-login?returnTo=${encodeURIComponent(returnTo)}`;

    // Safari can suspend timers while the native app is foregrounded.
    // Never redirect to the App Store after the user successfully left this page.
    let appOpened = false;
    let fallbackTimer;
    const cancelFallback = () => {
      appOpened = true;
      if (fallbackTimer !== undefined) clearTimeout(fallbackTimer);
    };
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") cancelFallback();
    });
    window.addEventListener("pagehide", cancelFallback);

    // Keep the existing native URL scheme and returnTo handoff unchanged.
    window.location.href = deepLink;

    // If the app was not opened, take the user to the App Store.
    fallbackTimer = setTimeout(() => {
      if (!appOpened && document.visibilityState !== "hidden") {
        window.location.href = APP_STORE_URL;
      }
    }, 1200);
  </script>
