  <script>
    (function(){
      const t = window.FynxPreferences?.getItem('fynx_theme') === 'light' ? 'light' : 'dark';

  <style>
    .section-header h2{font-size:28px;font-weight:700;letter-spacing:-.5px;color:#fff}
    body.light-mode .section-header h2{color:#000}
    .section-header p{font-size:13px;color:rgba(255,255,255,.7);margin-top:5px}
    body.light-mode .section-header p{color:#666}
    .card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:18px}
    body.light-mode .card{background:#fafafa;border-color:#e5e5e5}
    .card h3{font-size:14px;font-weight:800;margin-bottom:14px;color:inherit}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .field{display:grid;gap:6px}
    .field label{font-size:12px;font-weight:700;color:rgba(255,255,255,.78)}
    body.light-mode .field label{color:#555}
    .field input,.field select,.field textarea{height:40px;border:1px solid rgba(255,255,255,.16);border-radius:10px;padding:0 12px;background:rgba(255,255,255,.06);font-size:13px;color:#fff}
    .field textarea{height:86px;padding:10px 12px;resize:vertical}
    .field input::placeholder,.field textarea::placeholder{color:rgba(255,255,255,.5)}
    body.light-mode .field input,body.light-mode .field select,body.light-mode .field textarea{background:#fff;border-color:#ddd;color:#000}
    body.light-mode .field input::placeholder,body.light-mode .field textarea::placeholder{color:#888}
    .pill-row{display:flex;gap:8px;flex-wrap:wrap}
    .market-pill{padding:7px 10px;border:1px solid rgba(255,255,255,.26);border-radius:999px;font-size:12px;cursor:pointer;font-weight:700;color:#fff;background:transparent}
    .market-pill.on{background:#fff;color:#000;border-color:#fff}
    body.light-mode .market-pill{border-color:#ddd;color:#111}
    body.light-mode .market-pill.on{background:#000;color:#fff;border-color:#000}
    .actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
    .btn{height:40px;padding:0 14px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);font-size:13px;font-weight:800;cursor:pointer;text-decoration:none;color:#fff;display:inline-flex;align-items:center}
    .btn.primary{background:#fff;color:#000;border-color:#fff}
    body.light-mode .btn{border-color:#e5e5e5;background:#fff;color:#111}
    body.light-mode .btn.primary{background:#000;color:#fff;border-color:#000}
    .status{font-size:12px;color:rgba(255,255,255,.72);font-weight:600}
    body.light-mode .status{color:#555}
    .avatar{width:56px;height:56px;border-radius:999px;object-fit:cover;border:1px solid rgba(255,255,255,.2);background:#111}
    body.light-mode .avatar{border-color:#ddd;background:#fff}
    @media(max-width:900px){.grid{grid-template-columns:1fr}}
  </style>

      <div class="content-area">
        <div class="section-header"><h2>Account Settings</h2><p>Identity, support, legal, and trading profile controls.</p></div>

        <form class="card" id="accountForm">
          <h3>Identity</h3>
          <div class="grid">
            <div class="field"><label>Display name</label><input id="displayName" aria-label="Display name" required></div>
            <div class="field"><label>Username / handle</label><input id="username" aria-label="Username" placeholder="fynxtrader"></div>
            <div class="field" style="grid-column:1/-1"><label>Short bio</label><textarea id="bio" aria-label="Bio" maxlength="280"></textarea></div>
            <div class="field"><label>Country / region</label><input id="country" aria-label="Country"></div>
            <div class="field"><label>Timezone</label><input id="timezone" aria-label="Timezone"></div>
            <div class="field"><label>Preferred currency</label><select id="preferredCurrency" aria-label="Preferred currency"><option>USD</option><option>EUR</option><option>GBP</option><option>JPY</option><option>AUD</option></select></div>
            <div class="field"><label>Profile photo upload</label><input type="file" id="profilePhoto" aria-label="Profile photo" accept="image/*"></div>
          </div>
          <div style="margin:10px 0;display:flex;align-items:center;gap:10px"><img id="profilePreview" class="avatar" alt="Profile preview"><span class="status" id="photoStatus">No upload in progress.</span></div>

          <h3 style="margin-top:6px">Trading Profile</h3>
          <div class="grid">
            <div class="field"><label>Experience level</label><select id="experienceLevel" aria-label="Experience level"><option value="beginner">Beginner</option><option value="intermediate">Intermediate</option><option value="advanced">Advanced</option><option value="pro">Professional</option></select></div>
            <div class="field"><label>Risk profile</label><select id="riskProfile" aria-label="Risk profile"><option value="conservative">Conservative</option><option value="moderate">Moderate</option><option value="aggressive">Aggressive</option></select></div>
            <div class="field" style="grid-column:1/-1"><label>Preferred markets</label><div class="pill-row" id="marketPills"></div></div>
          </div>

          <h3 style="margin-top:8px">Support & Legal</h3>
          <div class="actions">
            <div style="display:flex;gap:8px;flex-wrap:wrap">
              <a class="btn" href="https://apps.apple.com/us/app/fynx-finance-world/id6752357210" target="_blank" rel="noopener">Download App</a>
              <a class="btn" href="mailto:support@fynxfinanceworld.com">Contact Support</a>
              <a class="btn" href="https://site.fynxfinanceworld.com/terms.html" target="_blank" rel="noopener">Terms</a>
              <a class="btn" href="https://site.fynxfinanceworld.com/privacy.html" target="_blank" rel="noopener">Privacy</a>
              <a class="btn" href="https://fynxfinanceworld.com/risk-disclosure" target="_blank" rel="noopener">Risk Disclosure</a>
            </div>
            <div style="display:flex;gap:8px;align-items:center"><span id="saveStatus" role="status" aria-live="polite" class="status">Ready</span><button class="btn primary" type="submit">Save changes</button></div>

  <script type="module" src="assets/js/session-bootstrap.js?v=20261113-shared-account-1"></script>
<script type="module">
    import {subscribe,accountData,sync} from './assets/js/account-sync.js?v=20261113-shared-account-1';
    import { auth, bootstrapAccount, saveUserProfile, uploadProfilePhoto, updateAuthProfile } from './assets/js/account-system.js?v=20261113-shared-account-1';
    import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';
    import { mountNotificationBell } from './assets/js/account-ui.js?v=20261113-shared-account-1';
    let profileDirty=false,profileOwner=null,profileEpoch=0,profileRevision=0;
    const markets = ['forex','crypto','stocks','indices','commodities','futures'];
    const marketPills = document.getElementById('marketPills');
    const selectedMarkets = new Set();
    const form = document.getElementById('accountForm');
    form.addEventListener('input',()=>profileDirty=true);form.addEventListener('click',event=>{if(event.target.closest('.market-pill'))profileDirty=true;});
    const saveStatus = document.getElementById('saveStatus');
    const photoStatus = document.getElementById('photoStatus');
    const profilePreview = document.getElementById('profilePreview');
    form.querySelector('button[type=submit]').disabled = true;
    saveStatus.textContent = 'Loading profile…';

    function applyTheme(){
      const t=window.FynxPreferences?.getItem('fynx_theme') === 'light' ? 'light' : 'dark';
      document.body.classList.toggle('dark-mode', t==='dark');
      document.body.classList.toggle('light-mode', t==='light');
      document.documentElement.dataset.theme = t;
    }
    document.getElementById('themeBtn')?.addEventListener('click',()=>{
      const light = document.body.classList.contains('light-mode');
      window.FynxPreferences?.setItem('fynx_theme',light?'dark':'light');
      applyTheme();
    });
    applyTheme();

    markets.forEach((m)=>{const b=document.createElement('button');b.type='button';b.className='market-pill';b.dataset.market=m;b.textContent=m.toUpperCase();b.onclick=()=>{b.classList.toggle('on');b.classList.contains('on')?selectedMarkets.add(m):selectedMarkets.delete(m)};marketPills.appendChild(b);});

    function setForm(profile){
      profileRevision=sync.record('profile','default')?.revision||0;
      ['displayName','username','bio','country','timezone','preferredCurrency','experienceLevel','riskProfile'].forEach((id)=>{if(profile[id]!=null)document.getElementById(id).value=profile[id];});
      profilePreview.dataset.photoUrl = profile.photoURL || '';
      profilePreview.src = profile.photoURL || 'https://dummyimage.com/112x112/eeeeee/666666&text=FX';
      selectedMarkets.clear();
      (profile.preferredMarkets || []).forEach((m)=>selectedMarkets.add(m));
      document.querySelectorAll('.market-pill').forEach((pill)=>pill.classList.toggle('on', selectedMarkets.has(pill.dataset.market)));
    }

    onAuthStateChanged(auth, async (user)=>{
      const epoch=++profileEpoch;profileOwner=user?.uid||null;profileDirty=false;form.reset();selectedMarkets.clear();profilePreview.src='';profilePreview.dataset.photoUrl='';form.querySelector('button[type=submit]').disabled=true;if(!user)return;
      try { const seeded = await bootstrapAccount(user);if(epoch!==profileEpoch||auth.currentUser?.uid!==user.uid)return;
      setForm({ ...seeded.profile, displayName: seeded.profile.displayName || user.displayName || '' });
      form.querySelector('button[type=submit]').disabled = false; saveStatus.textContent = 'Ready';
      } catch { saveStatus.textContent = 'Could not load your profile. Check your connection and reload before editing.'; form.querySelector('button[type=submit]').disabled = true; }
    });

    subscribe(s=>{if(s.uid===profileOwner&&s.ready&&!profileDirty){const data=accountData('profile');if(data)setForm(data);}});
    form.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const user = auth.currentUser;
      const button = form.querySelector('button[type=submit]');
      if (button.disabled) return;
      if (!user) { saveStatus.textContent = 'Sign in again to save your profile.'; return; }
      if (!navigator.onLine) { saveStatus.textContent = 'You’re offline. Reconnect to save. Your changes are still here.'; return; }
      button.disabled = true;
      saveStatus.textContent = 'Saving...';
      try {
      let photoURL = profilePreview.dataset.photoUrl || '';
      const file = document.getElementById('profilePhoto').files?.[0];
      if(file){
        try { photoStatus.textContent = 'Uploading photo...'; photoURL = await uploadProfilePhoto(user.uid, file); photoStatus.textContent = 'Photo uploaded.'; }
        catch(err){ photoStatus.textContent = 'Photo upload failed. Choose an image under 5 MB and try again.'; throw err; }
      }
      const payload = {
        displayName: document.getElementById('displayName').value.trim(),
        username: document.getElementById('username').value.trim(),
        bio: document.getElementById('bio').value.trim(),
        country: document.getElementById('country').value.trim(),
        timezone: document.getElementById('timezone').value.trim(),
        preferredCurrency: document.getElementById('preferredCurrency').value,
        experienceLevel: document.getElementById('experienceLevel').value,
        riskProfile: document.getElementById('riskProfile').value,
        preferredMarkets: Array.from(selectedMarkets),
        photoURL
      };
      await saveUserProfile(user.uid, payload,{expectedRevision:profileRevision});
      await updateAuthProfile({ displayName: payload.displayName, photoURL: payload.photoURL || null });
      profilePreview.dataset.photoUrl = payload.photoURL;
      if(payload.photoURL) profilePreview.src = payload.photoURL;
      try { localStorage.setItem('fynxUserName', payload.displayName || 'FYNX User'); } catch {}
      profileDirty=false;saveStatus.textContent = 'Saved to your account';
      document.getElementById('profilePhoto').value = '';
      } catch (error) { saveStatus.textContent = 'Could not finish saving. Your changes are still here. Check your connection and try again.'; }
      finally { button.disabled = false; }
    });

    mountNotificationBell();
  </script>
